name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write

jobs:
  # Only run release if CI passed (redundant with branch protection, but explicit)
  ci:
    uses: ./.github/workflows/ci.yaml

  bump:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install tools
        run: cargo install cargo-bump

      - uses: taiki-e/install-action@v2
        with:
          tool: cocogitto

      - name: Determine version and bump
        id: bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Determine next version from conventional commits since last tag
          NEXT_VERSION=$(cog bump --auto --dry-run --skip-untracked 2>&1) || true
          echo "cog dry-run output:"
          echo "$NEXT_VERSION"

          # Extract version from last line of output (cog may print warnings before)
          VERSION=$(echo "$NEXT_VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)

          # Check if we got a valid semver version
          if [ -n "$VERSION" ]; then
            echo "Bumping to version: $VERSION"

            # Update Cargo.toml and Cargo.lock
            cargo bump "$VERSION"
            cargo update --workspace

            # Commit, tag, and push
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): v$VERSION"
            git tag "v$VERSION"
            git push origin main --tags

            echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits found, skipping bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  goreleaser:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    permissions:
      contents: write
      packages: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.bump.outputs.version }}

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2.2.1

      - name: cosign-installer
        uses: sigstore/cosign-installer@v4.1.2

      - name: Anchore SBOM Action
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Docker Login
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install macOS SDKs
        shell: bash
        env:
          MACOS_SDK_URL: ${{ secrets.MACOS_SDK_URL }}
        run: |
          if [ -z "$MACOS_SDK_URL" ]; then
            echo "Error: MACOS_SDK_URL secret is not set"
            exit 1
          fi
          echo "Downloading macOS SDK from: ${MACOS_SDK_URL:0:19}..."
          curl -fsSL "$MACOS_SDK_URL" | tar -J -x -C /opt

      - uses: goreleaser/goreleaser-action@v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SDKROOT: /opt/MacOSX26.1.sdk
          GITHUB_REPOSITORY_URL: "${{ github.server_url }}/${{ github.repository }}"
          GITHUB_REPOSITORY: ${{ github.repository }}
