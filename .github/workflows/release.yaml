name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write

jobs:
  # Only run release if CI passed (redundant with branch protection, but explicit)
  ci:
    uses: ./.github/workflows/ci.yaml

  bump:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      bumped: ${{ steps.release.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install cargo-bump
        run: cargo install cargo-bump

      - name: Semver release
        id: release
        uses: cocogitto/cocogitto-action@v4
        continue-on-error: true
        with:
          command: bump
          args: --auto
          git-user: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"

  goreleaser:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2.2.1

      - name: cosign-installer
        uses: sigstore/cosign-installer@v4.0.0

      - name: Anchore SBOM Action
        uses: anchore/sbom-action/download-syft@v0.22.2

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3.7.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Docker Login
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install macOS SDKs
        shell: bash
        env:
          MACOS_SDK_URL: ${{ secrets.MACOS_SDK_URL }}
        run: |
          if [ -z "$MACOS_SDK_URL" ]; then
            echo "Error: MACOS_SDK_URL secret is not set"
            exit 1
          fi
          echo "Downloading macOS SDK from: ${MACOS_SDK_URL:0:50}..."
          curl -fsSL "$MACOS_SDK_URL" | tar -J -x -C /opt

      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SDKROOT: /opt/MacOSX11.3.sdk
          GITHUB_REPOSITORY_URL: "${{ github.server_url }}/${{ github.repository }}"
          GITHUB_REPOSITORY: ${{ github.repository }}
