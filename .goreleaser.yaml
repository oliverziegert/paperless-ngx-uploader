# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# Project name should ideally match the project name in your Cargo.toml.
project_name: paperless-ngx-uploader

before:
  hooks:
    - rustup default stable
    - rustup component add llvm-tools
    - cargo install --locked cargo-zigbuild
    - cargo install --locked cargo-xwin
    - rustup target add x86_64-unknown-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu
    - rustup target add x86_64-apple-darwin
    - rustup target add aarch64-apple-darwin
    - rustup target add x86_64-pc-windows-msvc
    #- rustup target add aarch64-pc-windows-msvc
    - cargo fetch --locked

# Actually builds the binaries.
builds:
  - builder: rust
    tool: cargo-zigbuild
    command: zigbuild
    flags:
      - --release
    id: linux-gnu-builds
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
  - builder: rust
    tool: cargo-xwin
    command: build
    flags:
      - --release
    id: win-msvc-builds
    targets:
      - x86_64-pc-windows-msvc
      #- aarch64-pc-windows-msvc


# Creates archives for each target.
archives:
  - formats: [ 'tar.gz' ]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]

checksum:
  name_template: "checksums.txt"

# Changelog configuration (will be in the github release).
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# A footer to add to all releases.
release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

# Creates Linux packages.
nfpms:
  - file_name_template: "{{ .ConventionalFileName }}"
    maintainer: paperless-ngx <paperless-ngx@pc-ziegert.dev>
    formats:
      - deb
      - apk
      - rpm

# Creates Darwin universal binaries.
universal_binaries:
  - replace: true

# Enables source archives.
source:
  enabled: true

# SBOMs for the archives.
sboms:
  - artifacts: archive

# Sign binaries with cosign.
# Reason: cosign v3 replaced the separate certificate/signature outputs with a
# single sigstore bundle file (--bundle), see https://goreleaser.com/blog/cosign-v3
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# Create Docker images.
# Reason: dockers_v2 replaces the deprecated `dockers` + `docker_manifests`
# combo. A single buildx build produces a multi-arch manifest (and SBOM), so we
# no longer need per-arch image suffixes or a separate manifest section.
# See https://goreleaser.com/deprecations#dockers
dockers_v2:
  - id: paperless-ngx-uploader
    dockerfile: Dockerfile
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}"
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"

# Sign the Docker images with cosign as well.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

# Sets up homebrew-taps.
# Reason: `brews` is deprecated; GoReleaser now generates Homebrew Casks for
# pre-compiled binaries instead of hackish formulas. Casks live in the `Casks`
# directory of the tap (the default). See https://goreleaser.com/deprecations#brews
# PS: this will require a personal access token, as it is cross-repository.
homebrew_casks:
  - name: "{{ .ProjectName }}"
    repository:
      owner: oliverziegert
      name: homebrew-tap
      token: "{{ .Env.GH_PAT }}"
    url:
      template: "{{ .Env.GITHUB_REPOSITORY_URL }}/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/oliverziegert/homebrew-tap"
    description: Example rust release.
    license: GPL-3.0
    skip_upload: false
    # Reason: the binary isn't Apple-notarized, so strip the quarantine
    # attribute on install to keep Gatekeeper from blocking it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/paperless-ngx-uploader"]
          end


